apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CHECKPOINT_DIR
              value: /app/checkpoints
            - name: MODEL_NAME
              value: classifier_v1.pt
            - name: MODEL_ARCH
              value: resnet18
            - name: NUM_CLASSES
              value: "10"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 15
          volumeMounts:
            - name: checkpoint-volume
              mountPath: /app/checkpoints
              readOnly: true
      volumes:
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: checkpoint-pvc
